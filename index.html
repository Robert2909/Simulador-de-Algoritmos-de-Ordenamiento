<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Algoritmos de Ordenamiento</title>
    <meta name="description" content="Entorno interactivo para la visualización y simulación de algoritmos de ordenamiento">
    
    <!-- Estilos modulares -->
    <link rel="stylesheet" href="./src/styles/base.css">
    <link rel="stylesheet" href="./src/styles/layout.css">
</head>
<body>
    <div id="app-root" class="app-layout">
        <header class="app-header">
            <h1>Simulador de Algoritmos</h1>
            <!-- Aquí irá el componente de selección de algoritmo -->
        </header>

        <main class="app-main">
            <section id="visualization-container" class="visualization-area" aria-label="Visualización del arreglo">
                <!-- Aquí se montará el componente array-view -->
            </section>
            
            <aside id="code-container" class="code-area" aria-label="Código fuente del algoritmo">
                <!-- Aquí se montará el componente code-viewer -->
            </aside>
        </main>

        <footer class="app-footer">
            <section id="controls-container" class="controls-area" aria-label="Controles de simulación">
                <div class="playback-controls">
                    <button id="btn-prev" class="btn" data-i18n="btn_prev">⏮ Atrás</button>
                    <button id="btn-play-pause" class="btn btn-primary" data-i18n="btn_play">▶ Play</button>
                    <button id="btn-next" class="btn" data-i18n="btn_next">Adelante ⏭</button>
                </div>
                
                <div class="speed-control">
                    <label for="speed-slider" data-i18n="label_speed">Velocidad:</label>
                    <input type="range" id="speed-slider" min="10" max="1000" step="10" value="860">
                </div>
            </section>
        </footer>
    </div>

    <!-- Script principal como módulo ES6 -->
    <script type="module" src="./src/app.js"></script>
</body>
</html>
