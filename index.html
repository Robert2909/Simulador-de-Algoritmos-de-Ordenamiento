<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app_title">Simulador de Algoritmos de Ordenamiento</title>
    <meta name="description" content="Entorno interactivo para la visualización y simulación de algoritmos de ordenamiento">
    
    <!-- Estilos modulares -->
    <link rel="stylesheet" href="./src/styles/base.css">
    <link rel="stylesheet" href="./src/styles/layout.css">
</head>
<body>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errDiv = document.createElement('div');
            errDiv.style = 'position:fixed; top:0; left:0; width:100%; padding:20px; background:red; color:white; z-index:9999; font-family:monospace;';
            errDiv.innerText = 'ERROR: ' + message + '\\n' + source + ':' + lineno;
            document.body.appendChild(errDiv);
        };
        window.addEventListener('unhandledrejection', function(e) {
            const errDiv = document.createElement('div');
            errDiv.style = 'position:fixed; top:0; left:0; width:100%; padding:20px; background:red; color:white; z-index:9999; font-family:monospace;';
            errDiv.innerText = 'PROMISE ERROR: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
            document.body.appendChild(errDiv);
        });
    </script>
    <div id="app-root" class="app-layout">
        <header class="app-header">
            <h1 data-i18n="app_title">Simulador de Algoritmos</h1>
            
            <div class="header-controls">
                <select id="algo-selector" data-i18n-aria="aria_algo_selector" aria-label="Selector de algoritmo">
                    <option value="bubble-sort">Bubble Sort</option>
                    <option value="selection-sort">Selection Sort</option>
                </select>

                <button id="mute-toggle" class="btn-icon" data-i18n-aria="aria_mute_toggle" aria-label="Alternar Sonido">🔊</button>
                <button id="theme-toggle" class="btn-icon" data-i18n-aria="aria_theme_toggle" aria-label="Cambiar tema oscuro/claro">🌓</button>
                <button id="colorblind-toggle" class="btn-icon" data-i18n-aria="aria_colorblind_toggle" aria-label="Modo Daltonismo">👁️</button>
                <select id="lang-selector" data-i18n-aria="aria_lang_selector" aria-label="Selector de idioma">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>
        </header>

        <div id="app-viewport" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;"></div>
    </div>

    <!-- Script principal como módulo ES6 -->
    <script type="module" src="./src/app.js"></script>
</body>
</html>
