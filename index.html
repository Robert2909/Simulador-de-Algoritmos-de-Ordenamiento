<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app_title">Simulador de Algoritmos de Ordenamiento</title>
    <meta name="description" content="Entorno interactivo para la visualización y simulación de algoritmos de ordenamiento">
    
    <!-- Estilos modulares -->
    <link rel="stylesheet" href="./src/styles/base.css">
    <link rel="stylesheet" href="./src/styles/layout.css">
</head>
<body>
    <div id="app-root" class="app-layout">
        <header class="app-header">
            <h1 data-i18n="app_title">Simulador de Algoritmos</h1>
            
            <div class="header-controls">
                <select id="algo-selector" data-i18n-aria="aria_algo_selector" aria-label="Selector de algoritmo">
                    <option value="bubble-sort">Bubble Sort</option>
                </select>

                <button id="mute-toggle" class="btn-icon" data-i18n-aria="aria_mute_toggle" aria-label="Alternar Sonido">🔊</button>
                <button id="theme-toggle" class="btn-icon" data-i18n-aria="aria_theme_toggle" aria-label="Cambiar tema oscuro/claro">🌓</button>
                <button id="colorblind-toggle" class="btn-icon" data-i18n-aria="aria_colorblind_toggle" aria-label="Modo Daltonismo">👁️</button>
                <select id="lang-selector" data-i18n-aria="aria_lang_selector" aria-label="Selector de idioma">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>
        </header>

        <main class="app-main">
            <array-view id="visualization-container" class="visualization-area" data-i18n-aria="aria_visualization" aria-label="Visualización del arreglo"></array-view>
            
            <code-viewer id="code-container" class="code-area" data-i18n-aria="aria_code" aria-label="Código fuente del algoritmo"></code-viewer>
        </main>

        <footer class="app-footer">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--spacing-md);">
                <input-controls></input-controls>
                <simulation-controls id="controls-container" class="controls-area" data-i18n-aria="aria_controls" aria-label="Controles de simulación"></simulation-controls>
            </div>
        </footer>
    </div>

    <!-- Script principal como módulo ES6 -->
    <script type="module" src="./src/app.js"></script>
</body>
</html>
